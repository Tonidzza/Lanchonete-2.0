<!DOCTYPE html>
<html lang="pt-BR">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Retro Burger | American Diner</title>

    <link rel="stylesheet" href="style.css">

</head>

<body>

    <!-- CABEÇALHO -->

    <header class="header">

        <a href="#" class="logo">
            RETRO<span>BURGER</span>
        </a>

        <nav class="menu">
            <a href="#inicio">Início</a>
            <a href="#cardapio">Cardápio</a>
            <a href="#sobre">Sobre</a>
            <a href="#contato">Contato</a>
        </nav>

        <button class="menu-btn">
            ☰
        </button>

    </header>


    <!-- HERO / PRIMEIRA TELA -->

    <main>

        <section class="hero" id="inicio">

            <div class="hero-content">

                <p class="retro-text">
                    EST. 1978
                </p>

                <h1>
                    BORN TO
                    <span>GRILL</span>
                </h1>

                <p class="subtitle">
                    O verdadeiro sabor dos clássicos
                    americanos.
                </p>

                <a href="#cardapio" class="btn">
                    VER CARDÁPIO
                </a>

            </div>

            <div class="hero-burger">
                🍔
            </div>

        </section>


        <!-- CARDÁPIO -->

        <section id="cardapio" class="section">

            <p class="section-label">
                OUR FAVORITES
            </p>

            <h2>
                BURGERS
            </h2>

            <div class="burger-card">

                <div class="burger-image">
                    🍔
                </div>

                <div class="burger-info">

                    <h3>
                        Classic Burger
                    </h3>

                    <p>
                        Hambúrguer artesanal, queijo,
                        molho especial e ingredientes frescos.
                    </p>

                    <strong>
                        R$ 29,90
                    </strong>

                </div>

            </div>

        </section>

    </main>


    <!-- RODAPÉ -->

    <footer id="contato">

        <h2>
            RETRO BURGER
        </h2>

        <p>
            Good Food. Good Times.
        </p>

    </footer>


    <script src="script.js"></script>

</body>

</html>
